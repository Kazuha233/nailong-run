<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奶龙快跑 🦖</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦖</text></svg>">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icon-512.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#101018; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  body { display:flex; align-items:center; justify-content:center; }
  #stage { position:fixed; inset:0; left:0; top:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; }  /* inset 兜底：旧 iOS(<14.5) 不识别 inset，显式四边补齐 */
  /* 竖屏（微信内置浏览器视口固定竖屏）→ 游戏旋转 90° 横板全屏显示（中心对齐视口） */
  body.portrait #stage {
    width:100vh; height:100vw;
    left:50%; top:50%;
    margin-left:-50vh; margin-top:-50vw;   /* 盒子中心 = 视口中心，旋转后正好铺满 */
    transform:rotate(90deg);
  }
  body.portrait #btnJump { right:22px; bottom:28px; left:auto; top:auto; }   /* 跟随画面：画面右下 → 旋转后视觉左下 */
  body.portrait #btnDuck  { left:22px; bottom:28px; right:auto; top:auto; }  /* 跟随画面：画面左下 → 旋转后视觉左上 */
  #game { image-rendering:pixelated; width:auto; height:auto; max-width:100%; max-height:100%; aspect-ratio:800/340; }
  .btn {
    position:absolute; bottom:28px; width:66px; height:66px; border-radius:50%;
    background:rgba(255,255,255,.16); color:#fff; font-size:24px; font-weight:bold;
    border:2px solid rgba(255,255,255,.32); display:none; align-items:center; justify-content:center;
    z-index:10; user-select:none; -webkit-user-select:none; font-family:"Microsoft YaHei",sans-serif;
  }
  .btn:active { background:rgba(255,255,255,.38); }
  #btnJump { right:22px; }  /* 跳 → 右下（顺手） */
  #btnDuck  { left:22px; }  /* 蹲 → 左下 */
  /* 手机版操作模式：上下分区（默认）不显示跳蹲按钮；经典按键模式（body.op-buttons）触屏显示 */
  @media (pointer:coarse) { body.op-buttons .btn { display:flex; } }
  #btnRestart {
    position:absolute; left:50%; top:84%; transform:translate(-50%,-50%);
    display:none; padding:10px 32px; font-size:18px; font-weight:bold;
    background:#FFB020; color:#5B3A00; border:none; border-radius:12px;
    cursor:pointer; font-family:"Microsoft YaHei",sans-serif;
    box-shadow:0 4px 0 #E08F00; z-index:20;
  }
  #btnRestart:active { transform:translate(-50%,-50%) translateY(3px); box-shadow:0 1px 0 #E08F00; }
  /* 设置（暂停）面板：统一居中面板，内部标题 + 三按钮竖排 */
  #pausePanel {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    display:none; flex-direction:column; align-items:center; gap:0.417em;
    background:rgba(16,16,28,.88); border:0.104em solid rgba(255,255,255,.18);
    border-radius:0.729em; padding:0.729em 1.354em; z-index:25;
    font-family:"Microsoft YaHei",sans-serif;
  }
  #pausePanel.show { display:flex; }
  #ppTitle { color:#fff; font-size:0.9375em; font-weight:bold; margin-bottom:0.222em; }
  .pp-btn {
    width:10em; padding:0.571em 0; font-size:0.729em; font-weight:bold;
    border:none; border-radius:0.643em; cursor:pointer; color:#fff;
    font-family:"Microsoft YaHei",sans-serif; box-shadow:0 0.214em 0 rgba(0,0,0,.35);
  }
  .pp-btn:active { transform:translateY(0.143em); box-shadow:none; }
  #ppResume { background:#4CAF50; }
  #ppRestart { background:#FFB020; color:#5B3A00; }
  #ppMenu { background:#2196F3; }
  /* 设置按钮（右上角）：点击暂停，可继续/重新开始 */
  #btnSettings {
    position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%;
    background:rgba(255,255,255,.16); color:#fff; font-size:14px;
    border:1.5px solid rgba(255,255,255,.32); display:none; align-items:center; justify-content:center;
    padding-bottom:6px;   /* ⚙️ 小字往上挪半行（emoji 视觉偏下补偿） */
    z-index:15; cursor:pointer; font-family:"Microsoft YaHei",sans-serif;
  }
  #btnSettings:active { background:rgba(255,255,255,.38); }
  /* 竖屏设置按钮位置由 resize() JS 计算（贴游戏画布视觉右上角，旋转后随画布） */
  /* 主界面：左侧模式选择 + 右侧极限排行榜 */
  #mainMenu {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    display:none; z-index:30;                        /* 尺寸由 resize() 按画布同步（宽80% 高100%，上下与画面齐平） */
    background:rgba(16,16,28,.88); border:2px solid rgba(255,255,255,.18);
    border-radius:1.14em; padding:1em 1.43em;
    flex-direction:row; gap:1em;
    font-family:"Microsoft YaHei",sans-serif;
  }
  #mmLeft { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.86em; }
  #mmRight { flex:1; border-left:1px solid rgba(255,255,255,.15); padding-left:1em; display:flex; flex-direction:column; }
  #mmTitle { color:#FFB020; font-size:1.86em; font-weight:bold; text-align:center; letter-spacing:0.23em; margin-bottom:0.23em; }
  .mm-title { color:#FFB020; font-size:1em; font-weight:bold; margin-bottom:0.29em; text-align:center; }
  .mm-btn {
    width:10.71em; padding:0.64em 0; font-size:1em; font-weight:bold; border:none; border-radius:0.71em; cursor:pointer;
    font-family:"Microsoft YaHei",sans-serif; color:#fff; box-shadow:0 0.21em 0 rgba(0,0,0,.35);
  }
  .mm-btn:active { transform:translateY(0.14em); box-shadow:none; }
  #mmNormal { background:#4CAF50; }
  #mmExtreme { background:#E8590C; }
  .lb-title { color:#FFB020; font-size:0.71em; font-weight:bold; text-align:center; margin-bottom:0.4em; }
  #lbList { flex:1; overflow-y:auto; overflow-x:hidden; color:#ddd; font-size:0.57em; line-height:1.9; padding-bottom:3.75em; padding-right:0.5em; -webkit-overflow-scrolling:touch; }  /* 右侧留白：滚动条相对内容更靠右 */
  #lbList::-webkit-scrollbar { width:1em; }
  #lbList::-webkit-scrollbar-thumb { background:rgba(255,255,255,.25); border-radius:0.375em; }
  #lbList::-webkit-scrollbar-track { background:transparent; }
  /* 排行榜行（昵称 / 时间 / 分数 三列 + 排名；em 相对 lbList 字号 0.57×base） */
  .lb-head, .lb-row { display:flex; align-items:center; gap:0.5em; padding:0.125em 0.25em; }
  .lb-head { color:rgba(255,255,255,.5); margin-bottom:0.25em; border-bottom:1px solid rgba(255,255,255,.12); }
  .lb-rank { width:3em; color:#FFB020; font-weight:bold; }
  .lb-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; position:relative; padding-left:1.875em; }  /* 预留左侧图标位：昵称文字齐平，图标凸出 */
  .lb-time { width:6.75em; text-align:center; color:rgba(255,255,255,.6); }
  .lb-score { width:4em; text-align:right; color:#FFD54A; font-weight:bold; }
  .lb-mine { background:rgba(255,176,32,.22); border-radius:0.5em; }
  /* 主菜单左下角：退出登录（父级 mainMenu 隐藏时自动隐藏） */
  #btnLogout {
    position:absolute; left:0.5em; bottom:0.5em;
    width:1.83em; height:1.83em; border-radius:50%;
    background:rgba(255,255,255,.16); color:#fff; font-size:0.86em;
    border:0.125em solid rgba(255,255,255,.32);
    display:flex; align-items:center; justify-content:center;
    z-index:31; cursor:pointer; font-family:"Microsoft YaHei",sans-serif;
  }
  #btnLogout:active { background:rgba(255,255,255,.38); }
  /* 主菜单左下角：操作设置（退出登录右边；圆角矩形小按钮同成就按钮风格） */
  #btnOpSettings {
    position:absolute; left:3em; bottom:0.5em;
    padding:0.2em 0.7em; font-size:0.71em; font-weight:bold;
    background:rgba(255,255,255,.16); color:#fff;
    border:0.1em solid rgba(255,255,255,.32);
    border-radius:0.7em; display:flex; align-items:center; justify-content:center;
    gap:0.14em; z-index:31; cursor:pointer; font-family:"Microsoft YaHei",sans-serif;
  }
  #btnOpSettings:active { background:rgba(255,255,255,.38); }
  /* 主菜单右下角：成就系统（圆角矩形小按钮：图标 + 文字，小号防挡榜单） */
  #btnAchieve {
    position:absolute; right:0.8em; bottom:0.8em;
    padding:0.2em 0.7em; font-size:0.71em; font-weight:bold;
    background:#2A2A3E; color:#fff;                 /* 不透明深色底色：内容滚到下方也不透 */
    border:0.1em solid rgba(255,255,255,.32);
    border-radius:0.7em; display:flex; align-items:center; justify-content:center;
    gap:0.2em; z-index:31; cursor:pointer; font-family:"Microsoft YaHei",sans-serif;
  }
  #btnAchieve:active { background:rgba(255,255,255,.38); }
  /* 成就界面（点右下角 🎖️ 打开：隐藏主菜单、全画布页面、列表可滚动） */
  #achievePanel {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    display:none; flex-direction:column; align-items:center; gap:0.625em;
    background:rgba(16,16,28,.92); border:0.125em solid rgba(255,255,255,.18);
    border-radius:1em; padding:0.75em 1.125em; z-index:36;      /* 尺寸由 resize() 跟随画布 */
    font-family:"Microsoft YaHei",sans-serif;
  }
  #achievePanel.show { display:flex; }
  #acTitle { color:#FFB020; font-size:0.875em; font-weight:bold; margin-top:-0.286em; }  /* 缩小并上移 */
  #acList {
    flex:1; width:100%; overflow-y:auto; overflow-x:hidden;
    display:flex; flex-direction:column; gap:0.375em; padding-right:0.6em;
    -webkit-overflow-scrolling:touch;   /* 滚动平滑；触摸用 pointer 手动拖拽（enableDragScroll） */
  }
  #acList::-webkit-scrollbar { width:0.5em; }
  #acList::-webkit-scrollbar-thumb { background:rgba(255,255,255,.25); border-radius:0.1875em; }
  #acList::-webkit-scrollbar-track { background:transparent; }
  .ac-item {
    display:flex; align-items:center; gap:0.727em; font-size:0.6875em; color:#fff;
    background:rgba(255,255,255,.06); border-radius:0.727em; padding:0.545em 0.909em;
  }
  .ac-equip {
    min-width:4.444em; padding:0.222em 0.667em; font-size:0.5625em; font-weight:bold;
    border:none; border-radius:0.667em; cursor:pointer; color:#fff;
    background:rgba(255,255,255,.16); font-family:"Microsoft YaHei",sans-serif;
  }
  .ac-equip:active { background:rgba(255,255,255,.3); }
  .ac-equip.on { background:#FFB020; color:#5B3A00; }
  .ac-equip-ph { min-width:2.5em; }   /* 未解锁时占位，保持对齐 */
  .ac-icon { font-size:1em; }
  .ac-name { font-weight:bold; white-space:nowrap; }
  .ac-desc { color:rgba(255,255,255,.6); font-size:0.625em; white-space:nowrap; }
  .ac-state { margin-left:auto; font-size:0.625em; white-space:nowrap; }
  .ac-locked { opacity:.45; }
  .lb-equip { position:absolute; left:0; top:50%; transform:translateY(-50%); }  /* 图标凸出在昵称左侧，不占昵称文本位 */
  /* 成就解锁通知（游戏画面上方滑入滑出） */
  #achNotify {
    position:absolute; top:10px; left:50%; transform:translateX(-50%) translateY(-90px);
    display:flex; align-items:center; gap:8px;
    background:rgba(16,16,28,.92); border:2px solid rgba(255,176,32,.6);
    border-radius:12px; padding:10px 18px; z-index:40;
    opacity:0; transition:transform .35s ease, opacity .35s ease;
    font-family:"Microsoft YaHei",sans-serif; pointer-events:none;
  }
  #achNotify.show { transform:translateX(-50%) translateY(0); opacity:1; }
  .an-icon { font-size:22px; }
  .an-text { color:#FFD54A; font-size:14px; font-weight:bold; white-space:nowrap; }
  /* 成就界面右上角关闭 × */
  #acClose {
    position:absolute; right:0.571em; top:0.571em;
    width:1.857em; height:1.857em; border-radius:50%;
    border:0.071em solid rgba(255,255,255,.32);
    background:rgba(255,255,255,.12); color:#fff; font-size:0.875em;
    cursor:pointer; font-family:"Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  #acClose:active { background:rgba(255,255,255,.3); }
  /* 退出登录确认弹窗（点左下角 🚪 后弹出） */
  #confirmPanel {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    display:none; flex-direction:column; align-items:center; gap:12px;
    background:rgba(16,16,28,.92); border:2px solid rgba(255,255,255,.18);
    border-radius:14px; padding:16px 24px; z-index:36;
    font-family:"Microsoft YaHei",sans-serif;
  }
  #confirmPanel.show { display:flex; }
  #cfTitle { color:#fff; font-size:15px; font-weight:bold; }
  #cfBtns { display:flex; gap:12px; }
  .cf-btn {
    width:96px; padding:8px 0; font-size:14px; font-weight:bold;
    border:none; border-radius:9px; cursor:pointer; color:#fff;
    font-family:"Microsoft YaHei",sans-serif; box-shadow:0 3px 0 rgba(0,0,0,.35);
  }
  .cf-btn:active { transform:translateY(2px); box-shadow:none; }
  #cfYes { background:#E8590C; }
  #cfNo  { background:rgba(255,255,255,.18); }
  /* 操作设置面板（主菜单左下角 🎮 打开：选择上下分区 / 经典按键） */
  #opPanel {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    display:none; flex-direction:column; align-items:center; gap:0.857em;
    background:rgba(16,16,28,.92); border:0.143em solid rgba(255,255,255,.18);
    border-radius:1em; padding:1.143em 1.714em; z-index:38;
    font-family:"Microsoft YaHei",sans-serif;
  }
  #opPanel.show { display:flex; }
  #opTitle { color:#FFB020; font-size:1.071em; font-weight:bold; }
  #opModes { display:flex; flex-direction:column; gap:0.571em; }
  .op-mode {
    width:14em; padding:0.571em 0.857em; font-size:0.857em; font-weight:bold;
    border:0.143em solid rgba(255,255,255,.25); border-radius:0.643em; cursor:pointer;
    background:rgba(255,255,255,.08); color:#fff; text-align:center;
    font-family:"Microsoft YaHei",sans-serif;
  }
  .op-mode .op-desc { display:block; font-size:0.75em; font-weight:normal; color:rgba(255,255,255,.6); margin-top:0.2em; }
  .op-mode.on { border-color:#FFB020; background:rgba(255,176,32,.22); color:#FFD54A; }
  #opClose {
    width:8em; padding:0.571em 0; font-size:0.857em; font-weight:bold;
    border:none; border-radius:0.643em; cursor:pointer; color:#fff;
    background:rgba(255,255,255,.18); font-family:"Microsoft YaHei",sans-serif;
    box-shadow:0 0.214em 0 rgba(0,0,0,.35);
  }
  #opClose:active { transform:translateY(0.143em); box-shadow:none; }
  /* 开始界面（注册/登录）：在主菜单之前，游戏画布风格 */
  #authMenu {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    display:none; flex-direction:column; align-items:center; z-index:35;
    background:rgba(16,16,28,.9); border:0.104em solid rgba(255,255,255,.2);
    border-radius:0.9375em; padding:1.25em 1.667em;
    font-family:"Microsoft YaHei",sans-serif;
  }
  #authHero { display:flex; flex-direction:column; align-items:center; }
  #authTitle { color:#FFB020; font-size:1.771em; font-weight:bold; letter-spacing:0.294em; text-shadow:0 0.088em 0 rgba(0,0,0,.45); }
  #authSub { color:#bbb; font-size:0.677em; margin:0.769em 0 1.692em; letter-spacing:0.077em; }
  #authBtns { display:flex; gap:0.833em; }
  .auth-btn {
    min-width:7.375em; padding:0.6875em 0; font-size:0.833em; font-weight:bold;
    border:none; border-radius:0.6875em; cursor:pointer; color:#fff;
    font-family:"Microsoft YaHei",sans-serif; box-shadow:0 0.25em 0 rgba(0,0,0,.35);
  }
  .auth-btn:active { transform:translateY(0.1875em); box-shadow:0 0.0625em 0 rgba(0,0,0,.35); }
  #btnRegister { background:#4CAF50; }
  #btnLogin   { background:#2196F3; }
  #authForm { display:none; flex-direction:column; align-items:center; gap:0.521em; width:13.02em; }
  #authForm.show { display:flex; }
  #afTitle { color:#FFB020; font-size:0.9375em; font-weight:bold; margin-bottom:0.111em; }
  #authForm input {
    width:100%; padding:0.643em 0.857em; font-size:0.729em; border-radius:0.643em; color:#fff;
    border:0.071em solid rgba(255,255,255,.25); background:rgba(255,255,255,.08);
    outline:none; font-family:"Microsoft YaHei",sans-serif;
  }
  #authForm input::placeholder { color:rgba(255,255,255,.4); }
  #authForm input:focus { border-color:#FFB020; }
  #afMsg { min-height:1.25em; font-size:0.625em; color:#FF8A80; text-align:center; }
  #afMsg.ok { color:#81C784; }
  #afBtns { display:flex; gap:0.625em; margin-top:0.104em; }
  .auth-btn-sm {
    width:6.857em; padding:0.571em 0; font-size:0.729em; font-weight:bold;
    border:none; border-radius:0.643em; cursor:pointer; color:#fff;
    font-family:"Microsoft YaHei",sans-serif; box-shadow:0 0.214em 0 rgba(0,0,0,.35);
  }
  .auth-btn-sm:active { transform:translateY(0.143em); box-shadow:none; }
  #afSubmit { background:#FFB020; color:#5B3A00; }
  #afBack { background:rgba(255,255,255,.18); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <button id="btnSettings">⚙️</button>
  <button id="btnRestart">🦖 再来一局</button>
  <!-- 设置（暂停）面板：标题 + 三按钮统一竖排 -->
  <div id="pausePanel">
    <div id="ppTitle">⏸️ 已暂停</div>
    <button id="ppResume" class="pp-btn">▶️ 继续</button>
    <button id="ppRestart" class="pp-btn">🦖 再来一局</button>
    <button id="ppMenu" class="pp-btn">🏠 主菜单</button>
  </div>
  <!-- 主界面：左栏（标题+模式选择） + 右栏（极限排行榜独占） -->
  <!-- 开始界面（注册/登录）：在主菜单之前 -->
  <div id="authMenu">
    <div id="authHero">
      <div id="authTitle">奶龙快跑</div>
      <div id="authSub">登录后开启冒险之旅</div>
      <div id="authBtns">
        <button id="btnRegister" class="auth-btn">注册</button>
        <button id="btnLogin" class="auth-btn">登录</button>
      </div>
    </div>
    <div id="authForm">
      <div id="afTitle">📝 注册</div>
      <input id="afNick" maxlength="12" autocomplete="off" placeholder="昵称（1~12 字）">
      <input id="afPwd" type="password" maxlength="32" autocomplete="off" placeholder="密码（6~32 位）">
      <input id="afPwd2" type="password" maxlength="32" autocomplete="off" placeholder="确认密码">
      <div id="afMsg"></div>
      <div id="afBtns">
        <button id="afSubmit" class="auth-btn-sm">确认</button>
        <button id="afBack" class="auth-btn-sm">返回</button>
      </div>
    </div>
  </div>
  <div id="mainMenu">
    <div id="mmLeft">
      <div id="mmTitle">奶龙快跑</div>
      <div class="mm-title">🎮 选择模式</div>
      <button id="mmNormal" class="mm-btn">🦖 普通模式</button>
      <button id="mmExtreme" class="mm-btn">🔥 极限模式</button>
    </div>
    <div id="mmRight">
      <div class="lb-title">🏆 极限排行榜</div>
      <div id="lbList">⏳ 接入中…</div>
    </div>
    <button id="btnLogout" title="退出登录">🚪</button>
    <button id="btnOpSettings" title="操作设置">🎮 操作设置</button>
    <button id="btnAchieve" title="成就系统">🎖️ 成就</button>
  </div>
  <!-- 成就系统面板 -->
  <div id="achievePanel">

let actx = null;
function initAudio(){

  if (actx && actx.state === 'suspended') actx.resume();

function beep(f0, f1, dur, type, vol){
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), actx.currentTime + dur);
  g.gain.setValueAtTime(vol||0.15, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}

}

  if (!actx) return;

  const buf = actx.createBuffer(1, Math.floor(actx.sampleRate*dur), actx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i=0;i<d.length;i++){
    last = last*0.9 + (Math.random()*2-1)*0.4;
    d[i] = last * (1 - i/d.length) * 0.8;
  }
  const s = actx.createBufferSource();
  s.buffer = buf;
  const f = actx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 300;
  const g = actx.createGain(); g.gain.value = 0.5;
  s.connect(f); f.connect(g); g.connect(actx.destination);

}

// SHA-256 纯 JS 实现（file:// 下 crypto.subtle 不可用，内置以支持本地预览）
function sha256(ascii){
  function rightRotate(value, amount){ return (value >>> amount) | (value << (32 - amount)); }
  const maxWord = Math.pow(2, 32);
  let result = '';
  const words = [];
  const asciiBitLength = ascii.length * 8;
  var hash = sha256.h = sha256.h || [];
  var k = sha256.k = sha256.k || [];
  let primeCounter = k.length;
  const isComposite = {};
  for (let candidate = 2; primeCounter < 64; candidate++){
    if (!isComposite[candidate]){
      for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (Math.pow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (Math.pow(candidate, 1/3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++){
    const j = ascii.charCodeAt(i);
    if (j >> 8) return '';   // 非 ASCII 需先 toUtf8Bytes
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((asciiBitLength / maxWord) | 0);
  words[words.length] = (asciiBitLength);
  for (let j = 0; j < words.length;){
    const w = words.slice(j, j += 16);
    const oldHash = hash;
    hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++){
      const w15 = w[i - 15], w2 = w[i - 2];
      let a = hash[0], e = hash[4];
      const temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e & hash[5]) ^ ((~e) & hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
          ) | 0);
      const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (let i = 0; i < 8; i++){
    for (let j = 3; j + 1; j--){
      const b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}
// UTF-8 → 单字节字符串（每字符一字节），供 sha256 处理中文密码
function toUtf8Bytes(str){
  return encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(m, p){ return String.fromCharCode(parseInt(p, 16)); });
}
function hashPassword(pwd){ return sha256(toUtf8Bytes(pwd)); }

function supabaseFetch(path, options){
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  };
  if (options && options.headers){
    for (const k in options.headers) headers[k] = options.headers[k];
  }
  const opts = Object.assign({}, options);
  opts.headers = headers;
  return fetch(SUPABASE_URL + '/rest/v1/' + path, opts);
}

function syncAchievements(ach){                // 成就解锁状态同步服务器（RPC sync_achievements）
  if (!loggedUser) return;

}
// 登录时从服务器拉取成就并合并（取并集：本地 ∪ 服务器，离线解锁的也会补传）
async function syncAchFromServer(){
  if (!loggedUser) return;
  try {
    const res = await supabaseFetch('users?select=achievements&nickname=eq.' + encodeURIComponent(loggedUser.nick));
    if (!res.ok) return;
    const data = await res.json();
    const serverAch = (data && data[0] && data[0].achievements) || {};
    const merged = Object.assign({}, serverAch, loadAch());
    if (allAchievementsDone(merged) && !merged.unique) merged.unique = true;   // 聚合成就补算
    saveAch(merged);                     // saveAch 内部会自动回传服务器（补全）
  } catch(e){}
}
// ---- 成就解锁统一入口：记录 + 同步服务器 + 画面上方通知（防重复） ----
function unlockAchievement(key, reached){
  const a = ACHIEVEMENTS.find(x => x.key === key);
  if (!a || !reached) return;
  const ach = loadAch();
  if (ach[key]) return;                    // 已解锁过：不重复通知
  ach[key] = true;
  saveAch(ach);                            // 本地 + 自动同步服务器
  renderAchievements();
  notifyAchievement(a);                    // 画面上方滑入通知
  if (allAchievementsDone(ach) && !ach.unique){   // 聚合成就：全部完成 → 解锁 💎 举世无双
    ach.unique = true;
    saveAch(ach);
    renderAchievements();
    notifyAchievement(ACHIEVEMENTS.find(x => x.key === 'unique'));
  }
}

function enableDragScroll(el){
  let down = false, startY = 0, startTop = 0;
  el.addEventListener('pointerdown', e => {
    down = true; startY = e.clientY; startTop = el.scrollTop;
    el.style.cursor = 'grabbing';
    try { el.setPointerCapture(e.pointerId); } catch(err){}
  });
  el.addEventListener('pointermove', e => {
    if (!down) return;
    el.scrollTop = startTop - (e.clientY - startY);
  });
  const endDrag = function(){ down = false; el.style.cursor = ''; };
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);
  el.addEventListener('pointerleave', endDrag);
}

async function submitAuth(){
  if (submitting) return;
  const nick = afNick.value.trim();
  const pwd  = afPwd.value;
  if (!/^[\u4e00-\u9fa5A-Za-z0-9_]{1,12}$/.test(nick)){
    showAfMsg('昵称需 1~12 位（中文/字母/数字/下划线）'); return;
  }
  if (pwd.length < 6 || pwd.length > 32){
    showAfMsg('密码需 6~32 位'); return;
  }
  const hash = hashPassword(pwd);
  submitting = true;
  try {
    if (authMode === 'register'){
      if (afPwd2.value !== pwd){ showAfMsg('两次密码不一致'); submitting = false; return; }
      const res = await supabaseFetch('users', {
        method: 'POST',
        headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ nickname: nick, password: hash })
      });
      if (res.ok){
        saveLogin(nick, hash);
        showAfMsg('注册成功，正在进入…', true);
        setTimeout(enterMainMenu, 600);
      } else {
        const t = await res.text();
        if (res.status === 409 || t.indexOf('duplicate') >= 0) showAfMsg('昵称已被注册，换一个试试');
        else if (t.indexOf('PGRST205') >= 0) showAfMsg('数据库未就绪：请主人先在 Supabase 建表');
        else showAfMsg('注册失败（' + res.status + '），请稍后重试');
      }
    } else {
      // 登录：数据库侧比对（password=eq.<hash>，哈希不回传前端）
      const res = await supabaseFetch('users?select=nickname&nickname=eq.' + encodeURIComponent(nick) + '&password=eq.' + hash);
      if (res.ok){
        const data = await res.json();
        if (data && data.length > 0){
          saveLogin(nick, hash);
          showAfMsg('登录成功，正在进入…', true);
          setTimeout(enterMainMenu, 600);
        } else {
          showAfMsg('昵称或密码不正确');
        }
      } else {
        const t = await res.text();
        if (t.indexOf('PGRST205') >= 0) showAfMsg('数据库未就绪：请主人先在 Supabase 建表');
        else showAfMsg('登录失败（' + res.status + '），请稍后重试');
      }
    }
  } catch(e){
    showAfMsg('网络异常，请检查连接后重试');
  } finally {
    submitting = false;
  }
}

// ---------- 画布自适应 ----------
function resize(){
  const dpr = window.devicePixelRatio || 1;
  canvas.width = VW*dpr; canvas.height = VH*dpr;
  // 竖屏视口（微信等内置浏览器）：旋转 90° 横板显示，可用尺寸宽高互换
  const portrait = innerHeight > innerWidth;
  document.body.classList.toggle('portrait', portrait);
  const aw = portrait ? innerHeight : innerWidth;
  const ah = portrait ? innerWidth : innerHeight;
  const r = Math.min(aw/VW, ah/VH);
  canvas.style.width  = (VW*r|0)+'px';
  canvas.style.height = (VH*r|0)+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // 主界面尺寸跟随游戏画面（宽 80%、高 100%——上下与画面齐平，不超出）
  const mm = document.getElementById('mainMenu');
  if (mm){
    const cw = parseFloat(canvas.style.width), ch = parseFloat(canvas.style.height);
    if (cw > 0 && ch > 0){
      mm.style.width  = Math.round(cw*0.9) + 'px';
      mm.style.height = Math.round(ch) + 'px';
      // 主菜单整体缩放基准：画布宽 800 → 19.2px（×1.2）；等比放大字号（限 10~48px 防极端）
      mm.style.fontSize = Math.max(10, Math.min(48, 19.2 * cw / 800)) + 'px';
    }
  }
  // 开始界面宽度跟随画布（高度自适应内容）+ 基准字号（同主菜单规格 19.2px @800）
  const am = document.getElementById('authMenu');
  if (am){
    const cw = parseFloat(canvas.style.width);
    if (cw > 0){
      am.style.width = Math.round(cw*0.56) + 'px';
      am.style.fontSize = Math.max(10, Math.min(48, 19.2 * cw / 800)) + 'px';
    }
  }
  // 成就界面尺寸跟随画布（宽 90%、高 100%，与主菜单同规格）
  const ap = document.getElementById('achievePanel');
  if (ap){
    const cw = parseFloat(canvas.style.width), ch = parseFloat(canvas.style.height);
    if (cw > 0 && ch > 0){
      ap.style.width  = Math.round(cw*0.9) + 'px';
      ap.style.height = Math.round(ch) + 'px';
      // 成就面板整体缩放基准（比主菜单大 1.6 倍：画布宽 800 → 25.6px，10~64px）
      ap.style.fontSize = Math.max(10, Math.min(64, 25.6 * cw / 800)) + 'px';
    }
  }
  // 设置（暂停）面板缩放基准（与主菜单同规格：画布宽 800 → 19.2px，10~48px）
  const pp = document.getElementById('pausePanel');
  if (pp){
    const cw = parseFloat(canvas.style.width);
    if (cw > 0) pp.style.fontSize = Math.max(10, Math.min(48, 19.2 * cw / 800)) + 'px';
  }
  // 设置按钮：横屏跟随画布右上角；竖屏由 JS 贴画布视觉右上角（stage 旋转 90°：画面左上 → 视觉右上）
  if (!portrait){
    const cw = parseFloat(canvas.style.width), ch = parseFloat(canvas.style.height);
    if (cw > 0 && ch > 0){
      btnSettings.style.left   = Math.round((innerWidth - cw)/2 + cw - 33) + 'px';
      btnSettings.style.top    = Math.round((innerHeight - ch)/2 + 3) + 'px';
      btnSettings.style.right  = 'auto';
      btnSettings.style.bottom = 'auto';
    }
  } else {
    // 竖屏（微信锁定）：按钮放画布本地右上 → 旋转后 = 视口右下 → 主人横看横板画面时 = 画面右上角
    const cw = parseFloat(canvas.style.width), ch = parseFloat(canvas.style.height);
    if (cw > 0 && ch > 0){
      btnSettings.style.left   = Math.round(cw - 33) + 'px';
      btnSettings.style.top    = Math.round((innerWidth - ch)/2 + 3) + 'px';
      btnSettings.style.right  = 'auto';
      btnSettings.style.bottom = 'auto';
    }
  }
  // 结算按钮：横屏跟随画布底部居中（防画布居中留白时 top:84% 掉出画面）
  if (!portrait){
    const cw = parseFloat(canvas.style.width), ch = parseFloat(canvas.style.height);
    if (cw > 0 && ch > 0){
      btnRestart.style.left   = Math.round((innerWidth - cw)/2 + cw/2) + 'px';
      btnRestart.style.top    = Math.round((innerHeight - ch)/2 + ch*0.84) + 'px';
      btnRestart.style.right  = 'auto';
      btnRestart.style.bottom = 'auto';
    }
  } else {
    btnRestart.style.left = btnRestart.style.top = btnRestart.style.right = btnRestart.style.bottom = '';
  }
}

  sn_mx = 0; snowActive = false; snowNext = 22; snowDur = 0; snowHint = 0;
  snowDepth = 0; snowElapsed = 0;
  j_q = false; j_dl = 0;
  th_lv = 0; th_cl = 0; thornHint = 0;

}

function checkPreload(){

const bgm = new Audio('assets/bgm.mp3');
bgm.preload = 'auto';
let bgmBroken = false;                 // 音频故障标记：BGM 提前 ended / error → 进度降级为距离估算
const DIST_TOTAL = 2330;               // 全程总距离（203s BGM × 速度公式推导：D(t)=1680*(e^(t/233.33)-1)）
// 播放兜底：iOS 上超时进入游戏时 BGM 可能未就绪（手势已解锁加载）→ 失败则 load + 就绪后自动补播
function tryPlayBgm(resetTime){
  if (resetTime) bgm.currentTime = 0;
  bgm.play().catch(function(){
    if (bgm.readyState < 3){          // 未缓冲够数据：显式加载，就绪后补播
      bgm.load();
      bgm.addEventListener('canplaythrough', function(){
        if (resetTime) bgm.currentTime = 0;
        bgm.play().catch(function(){});
      }, { once:true });
    }
  });
}
// canplaythrough：整首下载完才就绪（防边播边下卡顿；BGM 已压 128k/3.1MB，等待可接受）
bgm.addEventListener('canplaythrough', function(){ markLoaded(); checkPreload(); });
bgm.addEventListener('error', function(){
  markLoaded(); checkPreload();

});
bgm.addEventListener('ended', function(){
  // BGM 放完 = 到达雪峰 = 通关。
  // ⚠️ 防御：音频环境异常导致 BGM 提前 ended 时会误判通关（s_core 被硬设为 9999 上榜）——
  // 只有分数接近终点（进度 ≥99%，s_core ≥ 9900）才判定通关，提前中断只算音频故障、不假通关。
  if (state === 'playing'){
    if (Math.floor(s_core) >= 9900) w_gm();
    else bgmBroken = true;                     // 音频故障 → 进度降级为距离估算，跑够距离仍可通关
  }
});

    o = { type:'rock', x:VW+40, w:44, h:32, y:GROUND_Y };
  } else if (r < 0.84){                            // 荆棘丛生（14%：3~8 株连续刷新，无视前后障碍间距）
    const nThorn = 3 + Math.floor(Math.random()*6);   // 3~8 株

      tx += 14 + Math.random()*26;                    // 株距 14~40
    }
    spawnDist = 0;                                     // 无视间距：下一障碍紧贴荆棘丛生成（可与石块贴一起）
    return;                                            // 已直接 push，跳过结尾
  } else if (r < 0.9){
    if (night){                                    // 鳄鱼：仅黑夜，频率 6%（原 30% 的五分之一）
      o = { type:'croc', x:VW+40, w:136, h:48, y:GROUND_Y, vx: 3.2 };
    } else {                                       // 白天无鳄鱼：该区间归给石头
      o = { type:'rock', x:VW+40, w:44, h:32, y:GROUND_Y };
    }
  } else {                                         // 武装直升机（吊着 GIF 货物，低概率）
    o = { type:'heli', x:VW+60, w:HELI_W, h:HELI_H, y:GROUND_Y-50 };
  }
  ob_lst.push(o);
}

// ---------- 主更新 ----------
// 游戏主循环核心（内部化：不让外挂脚本通过包装全局 update 劫持游戏）
const _cu = function(dt){
  if (state !== 'playing') return;
  const k = dt*60;                                  // 归一化到 60fps 基准
  // 雪天机制：空中时场景减速（落地恢复）；荆棘缠身每层减速（1层0.82/2层0.64/3层0.46）
  const snowAirSlow = (sn_mx > 0.3 && !dno.onGround) ? 0.72 : 1;
  const thornSlow = th_lv > 0 ? (1 - 0.18*th_lv) : 1;
  const sceneK = k * snowAirSlow * thornSlow;
  // 雪天地滑：起跳延迟（到点且仍在地面则起跳）
  if (j_q){
    j_dl -= dt;
    if (j_dl <= 0){
      j_q = false;
      if (dno.onGround && state === 'playing' && th_lv <= 0){
        dno.vy = -10; dno.mode='jump'; dno.onGround=false; sfx.jump();
      }
    }
  }
  dno.animT += dt;

  // 速度随距离分递增（每280分+1，上限14.5；与显示分独立，保证难度曲线不变）
  spd = Math.min(6 + d_sco/280, 14.5);
  d_sco += spd * 0.02 * sceneK;
  // 显示分 = BGM 进度 × 9999（匀速增长，终点正好 9999）
  const progress = (isFinite(bgm.duration) && bgm.duration > 0 && !bgmBroken)
    ? Math.min(1, bgm.currentTime/bgm.duration)
    : Math.min(1, d_sco/DIST_TOTAL);       // 音频故障：按距离估算进度（不依赖 BGM）
  s_core = Math.floor(progress * 9999);
  if (progress >= 1 && state === 'playing') w_gm();   // 距离跑满 100% 兜底通关（BGM 故障时也生效）
  night = (Math.floor(d_sco/400) % 2) === 1;        // 日夜切换（按距离分，保持原节奏）
  nightMix += ((night ? 1 : 0) - nightMix) * Math.min(1, dt*1.6);   // 平滑渐变过渡
  // HUD 文字亮度：非雾天的黑天 → 渐变白字，雾天/白天渐变回深灰（雾里白字看不清）
  const hudTarget = (night && fog.opacity < 0.15) ? 1 : 0;
  hudLightMix += (hudTarget - hudLightMix) * Math.min(1, dt*2.5);
  // ==== 雷暴天（BGM 过半后事件式触发；接近终点时停止） ====
  const halfReached = (isFinite(bgm.duration) && bgm.duration > 0 && bgm.currentTime/bgm.duration > 0.5);
  const ending = (isFinite(bgm.duration) && bgm.duration - bgm.currentTime <= 6);   // 接近终点（剩余≤6秒）禁天气/障碍
  if (halfReached && !ending && !snowActive){   // 雪天与雷暴互斥（交替出现）
    if (!stormActive){
      stormNext -= dt;
      if (stormNext <= 0){
        stormActive = true;
        stormDur = 15 + Math.random()*15;   // 雷暴持续 15~30 秒
      }
    } else {
      stormDur -= dt;
      if (stormDur <= 0){
        stormActive = false;
        stormNext = 20 + Math.random()*25;  // 20~45 秒后可能再次雷暴
      }
    }
  } else {
    stormActive = false;
    stormNext = 12;
  }
  const stormTarget = (halfReached && !ending && stormActive) ? 1 : 0;
  stormMix += (stormTarget - stormMix) * Math.min(1, dt*0.8);
  // 闪电（雷暴进行中偶尔触发，闪下时全屏白一下）
  if (stormMix > 0.4){
    stormTimer -= dt;
    if (stormTimer <= 0){
      stormFlash = 0.9;
      stormTimer = 4 + Math.random()*5;      // 4~9 秒一次
      setTimeout(sfxThunder, 250);           // 闪电先见，雷声后至
    }
  }
  stormFlash = Math.max(0, stormFlash - dt*1.5);   // 白闪衰减放慢（约 0.6 秒，更有存在感）
  groundOffset = (groundOffset + spd*sceneK) % 24;

  // ==== 雾天事件（前一半仅夜晚起雾；后一半随时；接近终点不再起雾） ====
  // halfReached / ending 已在雷暴逻辑中声明，此处复用
  const fogAllowed = !ending && (halfReached || night);      // 接近终点禁雾
  if (!fogAllowed){
    fog.active = false;                          // 白天前半段：强制无雾
    fog.nextIn = 8;
    fog.opacity = Math.max(0, fog.opacity - dt*2.2);
  } else if (!fog.active){
    fog.nextIn -= dt * (snowActive ? 2.2 : 1);   // 雪天起雾更频繁（时不时起雾）
    if (fog.nextIn <= 0){
      fog.active = true;
      fog.duration = 8 + Math.random()*8;   // 持续 8~16 秒
      fog.hint = 2.2;
    }
  } else {
    fog.timer += dt;
    fog.duration -= dt;
    if (fog.duration <= 0){
      fog.active = false;
      fog.nextIn = 12 + Math.random()*12;  // 12~24 秒后可能再次起雾
    }
  }
  const fogTarget = fog.active ? 1 : 0;
  fog.opacity += (fogTarget - fog.opacity) * Math.min(1, dt*2.2);   // 平滑淡入淡出
  if (fog.hint > 0) fog.hint -= dt;

  // ==== 雪天事件（全程都可能出现，与雷暴交替：天空飘雪 + 起雾更频繁） ====
  if (!ending){
    if (!snowActive && !stormActive){
      snowNext -= dt;
      if (snowNext <= 0){
        snowActive = true;
        snowDur = 18 + Math.random()*12;   // 持续 18~30 秒（延长）
        snowElapsed = 0;
        snowHint = 2.2;
        snowFishUsed = false;              // 新雪天开始：重置奶鱼消耗标记
      }
    } else if (snowActive){
      snowDur -= dt;
      snowElapsed += dt;                   // 本次雪天已持续秒数
      if (snowDur <= 0){
        snowActive = false;
        if (!snowFishUsed) unlockAchievement('snowWalker', true);   // 整场雪天没用奶鱼且存活 → 解锁
        snowNext = 25 + Math.random()*20;  // 25~45 秒后可能再次下雪
      }
    }
  } else {
    snowActive = false;
    snowNext = 22;
  }
  const snowTarget = (!ending && snowActive) ? 1 : 0;
  sn_mx += (snowTarget - sn_mx) * Math.min(1, dt*0.8);
  // 积雪深度：雪下 4 秒后才开始积雪，8 秒内积到满；雪停后缓慢消融
  if (snowActive){
    const snowGrow = snowElapsed > 4 ? Math.min(1, (snowElapsed-4)/8) : 0;
    snowDepth += (snowGrow - snowDepth) * Math.min(1, dt*0.8);
  } else {
    snowDepth = Math.max(0, snowDepth - dt*0.12);
  }
  if (snowHint > 0) snowHint -= dt;
  if (thornHint > 0) thornHint -= dt;   // 荆棘提示淡出（缠身播报后自动消失）
  // 雪粒子更新（常驻，绘制时按 sn_mx 透明度显示）
  const stime = performance.now()/1000;
  for (const p of snowParticles){
    p.x += (p.vx + Math.sin(stime*1.3 + p.ph)*0.4) * k;
    p.y += p.vy * k;
    if (p.y > VH+5){ p.y = -5; p.x = Math.random()*VW; }
    if (p.x > VW+5) p.x = -5;
  }

  // 奶龙物理
  if (!dno.onGround){
    dno.vy += 0.55 * k;
    dno.y  += dno.vy * k;
    if (dno.y >= GROUND_Y){ dno.y = GROUND_Y; dno.vy = 0; dno.onGround = true; if (dno.mode==='jump') dno.mode='run'; }
  }
  // 蹲下由长按控制（pressDuck/releaseDuck），无自动站起

  // 障碍 / 奶鱼移动
  for (const o of ob_lst){
    o.x -= spd*sceneK;
    if (o.type === 'croc') o.x -= (o.vx||0)*sceneK;   // 鳄鱼额外爬行速度（比石头快）
    // 直升机进场瞬间播放出场音效（每架只响一次，实例池支持重叠）
    if (o.type === 'heli' && !o.sfxPlayed && o.x <= VW + 60){
      o.sfxPlayed = true;
      playHeliSfx();
    }
  }
  ob_lst = ob_lst.filter(o => o.x > -60);
  for (const f of f_sh) f.x -= spd*sceneK;
  f_sh = f_sh.filter(f => f.x > -40);

  // 生成节奏（接近终点 ending 时停止生成障碍/奶鱼，专心冲刺）
  if (!ending){
    spawnDist -= spd*sceneK;
    if (spawnDist <= 0){
      spawnObstacle();
      // 奶鱼高度随机（地面以上 68~98px，跳跃可及），出现频率 8.3%（25%÷3，保命道具更稀有）
      if (Math.random() < 0.25/3) f_sh.push({ x:VW+180, y:GROUND_Y-(68+Math.random()*30), w:20, h:13 });
      // 障碍间隔分段随机（打破均匀）：30% 密集段 / 50% 普通段 / 20% 稀疏段
      // 后四分之一段（progress>0.75，速度触顶）间距整体加大，避免连跳不及
      const distR = Math.random();
      const lateGap = progress > 0.75 ? 200 : 0;
      if (distR < 0.3)      spawnDist = (300 + lateGap) + Math.random()*150;   // 密集段 300~450（后期 500~650）
      else if (distR < 0.8) spawnDist = (500 + lateGap) + Math.random()*300;   // 普通段 500~800（后期 700~1000）
      else                  spawnDist = (900 + lateGap) + Math.random()*400;   // 稀疏段 900~1300（后期 1100~1500）
    }
  }

  // 无敌倒计时 / 护体提示
  if (in_v > 0) in_v -= dt;
  if (shieldHint > 0) shieldHint -= dt;

  // 碰撞（AABB，内缩容错 4~6px 保证手感）
  const dbox = dno.mode==='duck'
    ? { x1:dno.x-26, y1:dno.y-47, x2:dno.x+26, y2:dno.y }
    : { x1:dno.x-22, y1:dno.y-65, x2:dno.x+22, y2:dno.y };
  if (in_v <= 0){
    for (let i=ob_lst.length-1;i>=0;i--){
      const o = ob_lst[i];
      const ob = { x1:o.x-o.w/2+5, y1:o.y-o.h+3, x2:o.x+o.w/2-5, y2:o.y-2 };
      if (dbox.x1<ob.x2 && dbox.x2>ob.x1 && dbox.y1<ob.y2 && dbox.y2>ob.y1){
        if (o.type === 'croc'){           // 撞击鳄鱼计数（🐊 鳄啊~成就，一局 3 次）
          crocHitCount++;
          if (crocHitCount >= 3) unlockAchievement('crocHit', true);
        }
        if (o.type === 'bramble'){
          // 荆棘缠身：不会死，每撞 +1 层（最多 3 层，减速递增），需连续点蹲每 3 次去除一层
          if (th_lv < 3) th_lv++;
          thornHint = 2.5;
          sfx.fish();
          ob_lst.splice(i,1);
          continue;
        }
        if (f_cnt > 0){
          // 保命：奶鱼 -1，障碍破碎，短暂无敌 + 复活音效
          f_cnt--;
          if (snowActive) snowFishUsed = true;   // 雪天中消耗奶鱼：雪地行者标记
          spawnShards(o);
          if (o.type === 'heli'){       // 护体撞碎直升机：计数，够 8 架解锁 🚁 Man！
            heliBreakCount++;
            if (heliBreakCount >= 8) unlockAchievement('heliMan', true);
          }
          ob_lst.splice(i,1);
          in_v = 1.5;
          shieldHint = 1.2;
          reviveSfx.currentTime = 0;
          reviveSfx.play().catch(function(){});
        } else {
          g_ov(); return;
        }
      }
    }
  }
  for (let i=f_sh.length-1;i>=0;i--){
    const f = f_sh[i];
    if (dbox.x1<f.x+9 && dbox.x2>f.x-9 && dbox.y1<f.y+6.5 && dbox.y2>f.y-6.5){
      f_sh.splice(i,1); f_cnt++; sfx.fish();   // 奶鱼：保命+计数（不再加分，保证终点正好9999）
    }
  }
  // 碎片物理（重力 + 摩擦 + 旋转）
  // 荆棘行者累积：缠身期间连续前进 2500 分（荆棘解除则重新计数）
  if (th_lv > 0){
    thornScore += s_core - thornScoreBase;
    thornScoreBase = s_core;
    if (thornScore >= 2500) unlockAchievement('thornWalker', true);
  } else {
    thornScore = 0;
    thornScoreBase = s_core;
  }
  for (let i=sh_d.length-1;i>=0;i--){
    const s = sh_d[i];
    s.life -= dt;
    if (s.life <= 0){ sh_d.splice(i,1); continue; }
    s.vy += 0.5 * k;
    s.x += s.vx * k;
    s.y += s.vy * k;
    s.vx *= 0.98;
    s.rot += s.vr * k;
  }
}

// ---------- 绘制：奶龙（直立大胖子 · 程序绘制） ----------
function drawDino(){
  const t = dno.animT;
  ctx.save();
  let bob = 0, sx = 1, sy = 1, lean = 0;
  if (dno.mode === 'run'  && dno.onGround) bob = Math.sin(t*13)*3.2;
  if (dno.mode === 'jump'){ sy = 1.05; lean = -0.06; }
  if (dno.mode === 'duck'){ sy = 0.72; sx = 1.15; lean = 0.12; }
  ctx.translate(dno.x, dno.y + bob);
  ctx.rotate(lean);
  ctx.scale(sx*1.3, sy*1.3);   // 整体放大 1.3 倍

  const step = dno.onGround && dno.mode==='run' ? Math.sin(t*13) : 0;
  const lift = Math.abs(step)*4;
  const crouched = (dno.mode==='jump' || dno.mode==='duck');

  // ===== 腿（直立行走，交替迈步） =====
  ctx.fillStyle = '#FFD93D';
  if (crouched){
    // 跳跃/蹲下：腿弯曲并拢
    ctx.beginPath(); ctx.ellipse(-5, -3, 4, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 5, -3, 4, 5, 0, 0, Math.PI*2); ctx.fill();
  } else {
    // 跑步：左腿前右腿后，交替迈步 + 抬腿
    ctx.beginPath(); ctx.ellipse(-6 + step*6, -4 - lift, 4.2, 8 - lift*0.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 6 - step*6, -4 - lift, 4.2, 8 - lift*0.5, 0, 0, Math.PI*2); ctx.fill();
  }
  // 脚掌（贴地小圆）
  if (!crouched){
    ctx.fillStyle = '#F5C84A';
    ctx.beginPath(); ctx.ellipse(-6 + step*6, -1, 4.6, 2, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 6 - step*6, -1, 4.6, 2, 0, 0, Math.PI*2); ctx.fill();
  }

  // ===== 尾巴（屁股后面，跑动甩） =====
  ctx.save();
  ctx.translate(-16, -20);
  ctx.rotate(Math.sin(t*13)*0.25 + (dno.mode==='jump'?0.5:0));
  ctx.fillStyle = '#FFD93D';
  ctx.beginPath(); ctx.ellipse(-3, 0, 6.5, 4.2, -0.5, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // ===== 身体（竖椭圆，圆滚滚） =====
  ctx.fillStyle = '#FFD93D';
  ctx.beginPath(); ctx.ellipse(0, -26, 17, 20, 0, 0, Math.PI*2); ctx.fill();

  // ===== 大肚皮（白色凸出） =====
  ctx.fillStyle = '#FFF6E5';
  ctx.beginPath(); ctx.ellipse(1.5, -17, 13, 12, 0, 0, Math.PI*2); ctx.fill();

  // ===== 手臂（小短手，跑步摆动） =====
  const armSwing = dno.onGround && dno.mode==='run' ? Math.sin(t*13)*0.5 : (dno.mode==='jump' ? -0.5 : 0.35);
  ctx.fillStyle = '#FFD93D';
  ctx.save(); ctx.translate(14, -22); ctx.rotate(-armSwing);
  ctx.beginPath(); ctx.ellipse(0, 2, 3.5, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(-14, -22); ctx.rotate(armSwing);
  ctx.beginPath(); ctx.ellipse(0, 2, 3.5, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // ===== 头（大圆，圆滚滚，叠在身体正上方） =====
  ctx.fillStyle = '#FFD93D';
  ctx.beginPath(); ctx.arc(4, -46, 13, 0, Math.PI*2); ctx.fill();

  // ===== 背棘 + 头顶角（橙） =====
  // （主人指示：去掉橙色三角，奶龙光溜溜圆滚滚）

  // ===== 眼睛（大眼呆萌） =====
  ctx.fillStyle = '#2B2B2B';
  ctx.beginPath(); ctx.arc(9, -49, 3.8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(10.5, -50.5, 1.4, 0, Math.PI*2); ctx.fill();

  // ===== 笑脸（褐色曲线，眼睛右下方） =====
  ctx.strokeStyle = '#8B5A2B';
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(12.5, -44);
  ctx.quadraticCurveTo(14.5, -40.5, 16.5, -44);
  ctx.stroke();

  ctx.restore();
}

// ---------- 绘制：鳄鱼（地上爬，会自己前进） ----------
function drawCroc(x, y, t, w, h){
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(-1, 1);                             // 朝向修正：嘴朝左（面向奶龙爬来）
  const crawl = Math.sin(t*12);                 // 爬行节奏
  ctx.translate(0, -Math.abs(crawl)*1.5);       // 身体起伏
  // 尾巴（后摆）
  ctx.save();
  ctx.translate(-w*0.42, -h*0.5);
  ctx.rotate(Math.sin(t*12)*0.4 + 0.25);
  ctx.fillStyle = '#5C8C3C';
  ctx.beginPath(); ctx.ellipse(-w*0.14, 0, w*0.16, h*0.24, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  // 身体（长条）
  ctx.fillStyle = '#4E8A3A';
  ctx.beginPath(); ctx.ellipse(0, -h*0.55, w*0.42, h*0.45, 0, 0, Math.PI*2); ctx.fill();
  // 背部鳞片纹路
  ctx.fillStyle = '#3E6E2E';
  for (let i=0;i<4;i++){
    const bx = -w*0.3 + i*w*0.18;
    ctx.beginPath(); ctx.arc(bx, -h*0.88, h*0.14, 0, Math.PI*2); ctx.fill();
  }
  // 头（前伸）
  ctx.fillStyle = '#4E8A3A';
  ctx.beginPath(); ctx.ellipse(w*0.36, -h*0.5, w*0.17, h*0.3, 0.15, 0, Math.PI*2); ctx.fill();
  // 嘴（下颚张开）
  ctx.fillStyle = '#3E6E2E';
  ctx.beginPath(); ctx.ellipse(w*0.5, -h*0.26, w*0.13, h*0.18, 0.1, 0, Math.PI*2); ctx.fill();
  // 牙齿
  ctx.fillStyle = '#FFF';
  for (let i=0;i<3;i++){
    const tx = w*0.42 + i*w*0.065;
    ctx.beginPath();
    ctx.moveTo(tx, -h*0.16); ctx.lineTo(tx+h*0.06, -h*0.28); ctx.lineTo(tx+h*0.12, -h*0.16);
    ctx.closePath(); ctx.fill();
  }
  // 眼睛
  ctx.fillStyle = '#FFF';
  ctx.beginPath(); ctx.arc(w*0.44, -h*0.78, h*0.13, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2B2B2B';
  ctx.beginPath(); ctx.arc(w*0.455, -h*0.78, h*0.065, 0, Math.PI*2); ctx.fill();
  // 四只腿交替爬行
  for (let i=0;i<4;i++){
    const lx = -w*0.28 + i*w*0.19;
    const phase = (i%2===0) ? crawl : -crawl;
    ctx.fillStyle = '#4E8A3A';
    ctx.beginPath();
    ctx.ellipse(lx + phase*2, -h*0.14, h*0.1, h*0.2, phase*0.3, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ---------- 绘制：奶龙身上荆棘（缠身视觉，按层数叠加覆盖递增） ----------
function drawThornOnDino(){
  const L = th_lv;
  if (L <= 0) return;
  // 跟随奶龙身体的上下浮动（bob 与 drawDino 一致）
  const bob = (dno.mode === 'run' && dno.onGround) ? Math.sin(performance.now()/1000*13)*3.2 : 0;
  const bx = dno.x, by = dno.y + bob;
  // 棕色枝条：层数越多缠得越满（1层4根 / 2层6根 / 3层10根，绕身体分布）
  ctx.strokeStyle = '#8B5A2B';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  const branches = 2 + L*2 + (L===3 ? 2 : 0);
  const span = (L===3) ? 13 : 8;                 // 垂直分布半径（3层往上覆盖到头部）
  for (let i=0;i<branches;i++){
    const t = i / Math.max(1, branches-1);
    const ang = -1.1 + t*2.2;                    // 从左上到右下绕身分布
    const cx = bx + Math.cos(ang)*4, cy = by - 16 + Math.sin(ang)*span;
    const ex = bx + Math.cos(ang)*11, ey = by - 16 + Math.sin(ang)*span + 3*Math.sin(i*2.1);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.quadraticCurveTo(bx + Math.cos(ang)*7, by - 16 + Math.sin(ang)*span, ex, ey);
    ctx.stroke();
  }
  // 绿色纸条（交错，覆盖身体更多部位）
  ctx.strokeStyle = '#3E8E41';
  ctx.lineWidth = 2;
  const leaves = 2 + L*2 + (L===3 ? 2 : 0);
  for (let i=0;i<leaves;i++){
    const t = i / Math.max(1, leaves-1);
    const lx = bx - 10 + t*20, ly = by - 20 - (L===3 && i>=leaves-2 ? 8 : 0) + (i%2)*6;
    const dir = (i%2===0) ? 1 : -1;
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.quadraticCurveTo(lx + dir*4, ly - 5, lx + dir*7, ly - 9);
    ctx.stroke();
  }
  // 浅绿尖刺（按层，覆盖递增）
  ctx.fillStyle = '#A5D6A7';
  const spikes = 2 + L*2 + (L===3 ? 2 : 0);
  for (let i=0;i<spikes;i++){
    const t = i / Math.max(1, spikes-1);
    const lx = bx - 10 + t*20, ly = by - 22 - (L===3 && i>=spikes-2 ? 8 : 0) - (i%2)*4;
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(lx + 2.5, ly - 7);
    ctx.lineTo(lx + 5, ly);
    ctx.closePath(); ctx.fill();
  }
  // 3 层：额外荆棘缠到头部（更满更密）
  if (L === 3){
    ctx.strokeStyle = '#8B5A2B';
    ctx.lineWidth = 2;
    for (let i=0;i<3;i++){
      const hx = bx - 6 + i*6, hy = by - 26;
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.quadraticCurveTo(hx + 2, hy - 5, hx + (i%2 ? -1 : 1)*4, hy - 8);
      ctx.stroke();
    }
    ctx.strokeStyle = '#3E8E41';
    for (let i=0;i<2;i++){
      const hx = bx - 4 + i*8, hy = by - 28;
      const dir = i%2 ? 1 : -1;
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.quadraticCurveTo(hx + dir*3, hy - 4, hx + dir*6, hy - 7);
      ctx.stroke();
    }
    ctx.fillStyle = '#A5D6A7';
    for (let i=0;i<2;i++){
      const hx = bx - 3 + i*6, hy = by - 30;
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.lineTo(hx + 2.5, hy - 6);
      ctx.lineTo(hx + 5, hy);
      ctx.closePath(); ctx.fill();
    }
  }
}

  ctx.beginPath(); ctx.arc(-96, -20, 5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawHeli(x, y, t, w, h){
  // y = GIF 货物底部；w/h = GIF 显示尺寸
  const swing = Math.sin(t*1.8)*0.14;      // 摆动角
  const sx    = Math.sin(t*1.8)*7;         // 横向摆幅
  // 直升机位置（侧视低空悬停，跳跃碰不到）
  const hx = x, hy = GROUND_Y - 180;
  // 吊绳（短）：机腹 → GIF 吊点
  const hookX = x + sx, hookY = y - h;
  ctx.strokeStyle = 'rgba(230,230,230,.9)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(hx, hy + 25); ctx.lineTo(hookX, hookY); ctx.stroke();
  // 吊挂 GIF（帧序列播放，绕吊点摆动）
  ctx.save();
  ctx.translate(hookX, hookY);
  ctx.rotate(swing);
  const fi = Math.floor(t*HELI_FPS) % HELI_FRAMES;
  // 雪碧图裁剪：第 fi 帧 → (列, 行) 坐标
  const sw = heliSprite.naturalWidth / HELI_SPRITE_COLS;
  const sh = heliSprite.naturalHeight / HELI_SPRITE_ROWS;
  ctx.drawImage(heliSprite, (fi % HELI_SPRITE_COLS)*sw, Math.floor(fi/HELI_SPRITE_COLS)*sh, sw, sh, -w/2, 0, w, h);
  ctx.restore();
  // 直升机本体
  drawHeliBody(hx, hy, t);
}
function drawFish(x, y){
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#FFC93C';
  ctx.beginPath(); ctx.ellipse(0, 0, 10, 6.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(-15, -6); ctx.lineTo(-15, 6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2B2B2B';
  ctx.beginPath(); ctx.arc(4, -2, 1.6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.beginPath(); ctx.arc(6.5, -3.5, 1, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ---------- 颜色插值（昼夜渐变用） ----------
function lerpColor(a, b, t){
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(((pa>>16)&255) + (((pb>>16)&255)-((pa>>16)&255))*t);
  const g = Math.round(((pa>>8)&255) + (((pb>>8)&255)-((pa>>8)&255))*t);
  const bl = Math.round((pa&255) + ((pb&255)-(pa&255))*t);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

// ---------- 绘制：雷暴雨滴（斜风细雨） ----------
function drawRain(t){
  if (stormMix <= 0.02) return;
  ctx.strokeStyle = 'rgba(200,220,255,' + (0.45*stormMix) + ')';
  ctx.lineWidth = 1.2;
  for (let i=0;i<60;i++){
    const sp = 500 + (i%5)*90;                       // 每滴速度（视差）
    const yy = ((i*37 + t*sp) % (VH+50)) - 25;       // 循环下落
    const xx = ((i*97) % (VW+90)) - 45 + yy*0.18;    // 斜向（风）
    ctx.beginPath();
    ctx.moveTo(xx, yy);
    ctx.lineTo(xx + 3, yy + 14);
    ctx.stroke();
  }
}

// ---------- 绘制：飘雪（雪天粒子，前景） ----------
function drawSnow(){
  if (sn_mx <= 0.02) return;
  ctx.fillStyle = 'rgba(255,255,255,' + (0.75*sn_mx) + ')';
  for (const p of snowParticles){
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  }
}

// ---------- 绘制：背景 ----------
function drawBackground(t){
  const p = nightMix;                                 // 0=白天 1=夜晚
  const sky  = lerpColor(PAL.day.sky,  PAL.night.sky,  p);
  const sky2 = lerpColor(PAL.day.sky2, PAL.night.sky2, p);
  const hill = lerpColor(PAL.day.hill, PAL.night.hill, p);
  const ground = lerpColor(PAL.day.ground, PAL.night.ground, p);
  const line  = lerpColor(PAL.day.line, PAL.night.line, p);
  const cloudA = 0.9 - 0.8*p;                          // 云随夜晚变淡
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, sky); g.addColorStop(1, sky2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, GROUND_Y);
  // 星星（随夜晚程度渐显）
  if (p > 0.02){
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    for (const s of stars){
      const a = (0.5 + 0.5*Math.sin(t*2 + s.tw)) * p;
      ctx.globalAlpha = a; ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;
  }
  // 云（视差）
  ctx.fillStyle = 'rgba(255,255,255,' + cloudA + ')';
  for (const c of clouds){
    const cx = ((c.x - t*8*c.s) % (VW+160) + VW+160) % (VW+160) - 80;
    ctx.beginPath();
    ctx.ellipse(cx, c.y, 26*c.s, 12*c.s, 0, 0, Math.PI*2);
    ctx.ellipse(cx+18*c.s, c.y+3*c.s, 18*c.s, 9*c.s, 0, 0, Math.PI*2);
    ctx.ellipse(cx-18*c.s, c.y+4*c.s, 15*c.s, 8*c.s, 0, 0, Math.PI*2);
    ctx.fill();
  }
  // 远山
  ctx.fillStyle = hill;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  for (let x=0; x<=VW; x+=40){
    ctx.lineTo(x, GROUND_Y-14 - Math.sin(x*0.008 + 1)*10 - Math.sin(x*0.021)*6);
  }
  ctx.lineTo(VW, GROUND_Y);
  ctx.closePath(); ctx.fill();
  // 地面（扩大覆盖，镜头拉远时不露矩形边界）——草地保持原色，积雪只盖表面
  ctx.fillStyle = ground;
  ctx.fillRect(-120, GROUND_Y, VW+240, VH-GROUND_Y+120);
  const snowCover = Math.max(0, snowDepth);                  // 积雪程度（延迟积雪，随雪天渐变）
  // line 是 'rgb(...)' 格式（不能直接喂给 lerpColor 的 hex 解析）→ 解析后与雪白(#F2F7FC)混合
  const _lm = line.match(/\d+/g);
  const lineCol = 'rgb(' + Math.round(+_lm[0]+(242-+_lm[0])*snowCover) + ',' + Math.round(+_lm[1]+(247-+_lm[1])*snowCover) + ',' + Math.round(+_lm[2]+(252-+_lm[2])*snowCover) + ')';
  ctx.fillStyle = lineCol;
  ctx.fillRect(0, GROUND_Y, VW, 2);
  // 积雪层（下雪时地表表面覆盖一层雪，随雪量变厚/变实）
  if (sn_mx > 0.02){
    const snowH = 3 + 9*sn_mx;                               // 雪层厚度 3~12px
    ctx.fillStyle = 'rgba(235,245,255,' + (0.5 + 0.5*sn_mx) + ')';
    ctx.fillRect(-120, GROUND_Y - snowH*0.3, VW+240, snowH);
  }
  // 滚动小草
  ctx.fillStyle = lineCol;
  for (let x=-24; x<VW+24; x+=24){
    const gx = x + groundOffset;
    ctx.fillRect(gx, GROUND_Y+8, 2, 5);
    ctx.fillRect(gx+10, GROUND_Y+5, 2, 4);
  }
}

// ---------- 绘制：UI ----------
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
// HUD 文字颜色：深灰(43) → 白(255) 按 hudLightMix 插值，alpha 同步过渡
function hudCol(a0, a1){
  const c = Math.round(43 + (255-43)*hudLightMix);
  const al = a0 + (a1-a0)*hudLightMix;
  return 'rgba(' + c + ',' + c + ',' + c + ',' + al.toFixed(2) + ')';
}

// ---------- 绘制：雾天 ----------
function drawFog(){
  if (fog.opacity <= 0.01) return;
  const a = fog.opacity;
  // 雾色随天气：白天=白雾，夜晚/雷暴=蓝灰雾
  const cool = Math.max(nightMix, stormMix, sn_mx);   // 雾色随天气：白天白雾，夜晚/雷暴/雪天偏冷蓝
  const R1 = Math.round(190 + (245-190)*cool);
  const G1 = Math.round(205 + (245-205)*cool);
  const B1 = Math.round(225 + (240-225)*cool);
  const R2 = Math.round(170 + (240-170)*cool);
  const G2 = Math.round(185 + (240-185)*cool);
  const B2 = Math.round(210 + (235-210)*cool);
  // 全屏雾底
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, 'rgba(' + R1 + ',' + G1 + ',' + B1 + ',' + (0.30*a) + ')');
  g.addColorStop(1, 'rgba(' + R2 + ',' + G2 + ',' + B2 + ',' + (0.45*a) + ')');
  ctx.fillStyle = g;
  ctx.fillRect(-120, -120, VW+240, VH+240);   // 扩大覆盖，镜头拉远时不露雾的矩形边界
  // 右侧更浓（障碍来向，视线受阻重）
  const g2 = ctx.createLinearGradient(VW*0.45, 0, VW, 0);
  g2.addColorStop(0, 'rgba(' + R1 + ',' + G1 + ',' + B1 + ',0)');
  g2.addColorStop(1, 'rgba(' + R1 + ',' + G1 + ',' + B1 + ',' + (0.55*a) + ')');
  ctx.fillStyle = g2;
  ctx.fillRect(-120, -120, VW+240, VH+240);   // 扩大覆盖
  // 飘动雾团
  const R3 = Math.round(200 + (250-200)*cool);
  const G3 = Math.round(215 + (250-215)*cool);
  const B3 = Math.round(235 + (245-235)*cool);
  ctx.fillStyle = 'rgba(' + R3 + ',' + G3 + ',' + B3 + ',' + (0.26*a) + ')';
  for (let i=0;i<5;i++){
    const fx = ((fog.timer*(18+i*6) + i*180) % (VW+320)) - 160;
    const fy = 80 + i*38 + Math.sin(fog.timer*0.5 + i)*12;
    ctx.beginPath(); ctx.ellipse(fx, fy, 130+i*24, 42, 0, 0, Math.PI*2); ctx.fill();
  }
}

// ---------- 绘制：终点雪峰 ----------
function drawSnowMountain(x){

  ctx.beginPath();
  ctx.moveTo(x-95, baseY);
  ctx.lineTo(x-30, baseY-peakH);
  ctx.lineTo(x+60, baseY-peakH*0.6);
  ctx.lineTo(x+100, baseY);
  ctx.closePath(); ctx.fill();
  // 主峰积雪
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath();
  ctx.moveTo(x-30, baseY-peakH);
  ctx.lineTo(x-14, baseY-peakH+26);
  ctx.lineTo(x+6,  baseY-peakH+14);
  ctx.lineTo(x+24, baseY-peakH+32);
  ctx.lineTo(x+60, baseY-peakH*0.6);
  ctx.lineTo(x-30, baseY-peakH);
  ctx.closePath(); ctx.fill();
  // 副峰（左侧）
  ctx.fillStyle = lerpColor('#8FA3B8', '#5A6A80', p);
  ctx.beginPath();
  ctx.moveTo(x-155, baseY);
  ctx.lineTo(x-100, baseY-72);
  ctx.lineTo(x-42, baseY);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath();
  ctx.moveTo(x-100, baseY-72);
  ctx.lineTo(x-86, baseY-52);
  ctx.lineTo(x-64, baseY-66);
  ctx.closePath(); ctx.fill();
  // 山腰雪痕
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath();
  ctx.moveTo(x-2, baseY-peakH+34);
  ctx.lineTo(x+10, baseY-peakH+46);
  ctx.lineTo(x+24, baseY-peakH+32);
  ctx.lineTo(x-2, baseY-peakH+34);
  ctx.closePath(); ctx.fill();
  // 底部云雾
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.ellipse(x-25, baseY-6, 135, 15, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.2)';
  ctx.beginPath(); ctx.ellipse(x-70, baseY-16, 95, 12, 0, 0, Math.PI*2); ctx.fill();
}

// ---------- 绘制：BGM 进度条（草坪位置） ----------
function drawProgress(){
  if (state !== 'playing') return;
  const dur = bgm.duration;
  if (!isFinite(dur) || dur <= 0) return;

  ctx.beginPath(); ctx.arc(barX + barW*p, barY + barH/2, 7, 0, Math.PI*2); ctx.stroke();

}

// ---------- 主循环 ----------
function draw(){
  if (state === 'loading'){ drawLoading(); return; }
  const t = performance.now()/1000;

  // 临近终点（BGM 剩余 5 秒）：镜头逐渐拉远
  const remain = isFinite(bgm.duration) ? bgm.duration - bgm.currentTime : 999;
  const nearing = (state === 'playing') && remain <= 5;
  if (nearing) zoom = Math.max(0.8, 1 - (5 - Math.max(0,remain))/5 * 0.2);

  // 镜头缩放基底色（拉远时露出的天空，昼夜渐变）
  ctx.fillStyle = lerpColor(PAL.day.sky, PAL.night.sky, nightMix);
  ctx.fillRect(0, 0, VW, VH);

  ctx.save();
  ctx.translate(VW/2, VH/2);
  ctx.scale(zoom, zoom);
  ctx.translate(-VW/2, -VH/2);

  drawBackground(t);
  // 雷暴：背景压暗（扩大覆盖，镜头拉远时不露矩形边界）
  if (stormMix > 0.02){
    ctx.fillStyle = 'rgba(45,55,80,' + (0.35*stormMix) + ')';
    ctx.fillRect(-120, -120, VW+240, VH+240);
  }
  // 雪天：背景轻微冷白罩（雪夜氛围）
  if (sn_mx > 0.02){
    ctx.fillStyle = 'rgba(225,238,252,' + (0.10*sn_mx) + ')';
    ctx.fillRect(-120, -120, VW+240, VH+240);
  }
  // 终点雪峰：BGM 剩余 5 秒时出现，2 秒内滑入画面中央偏右
  if (nearing || state === 'win'){
    let snowX = VW*0.62;
    if (nearing){
      const phase = Math.min(1, Math.max(0, (5 - remain)/2));
      snowX = VW + 150 + phase * (VW*0.62 - (VW+150));
    }
    drawSnowMountain(snowX);
  }
  for (const f of f_sh) drawFish(f.x, f.y);
  for (const o of ob_lst){
    if (o.type==='chili') drawChili(o.x, o.y, o.h);
    else if (o.type==='rock') drawRock(o.x, o.y, o.w, o.h);
    else if (o.type==='croc') drawCroc(o.x, o.y, t, o.w, o.h);
    else if (o.type==='bramble') drawBramble(o.x, o.y, o.w, o.h);
    else drawHeli(o.x, o.y, t, o.w, o.h);
  }
  // 碎片
  for (const s of sh_d){
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.globalAlpha = Math.min(1, s.life*2.2);
    ctx.fillStyle = s.color;
    ctx.fillRect(-s.size/2, -s.size/2, s.size, s.size);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  // 保命无敌期间奶龙闪烁
  if (in_v > 0 && state === 'playing' && Math.floor(performance.now()/60)%2===0) ctx.globalAlpha = 0.35;
  drawDino();
  ctx.globalAlpha = 1;
  if (th_lv > 0 && state === 'playing') drawThornOnDino();   // 荆棘缠身视觉
  drawRain(t);          // 雨滴在前景（淋在奶龙身上）
  drawSnow();           // 雪花在前景（飘雪）
  drawFog();
  ctx.restore();

  // 闪电白闪（全屏变白一小会，不覆盖 UI/进度条）
  if (stormFlash > 0.01){
    ctx.fillStyle = 'rgba(255,255,255,' + stormFlash + ')';
    ctx.fillRect(0, 0, VW, VH);
  }

  // 雾天提示
  if (fog.hint > 0 && state === 'playing'){
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, fog.hint*1.4) + ')';
    ctx.font = 'bold 18px "Microsoft YaHei", sans-serif';
    ctx.fillText('🌫️ 起雾了！前方视线受阻！', VW/2, 34);
  }
  if (snowHint > 0 && state === 'playing'){
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, snowHint*1.4) + ')';
    ctx.font = 'bold 15px "Microsoft YaHei", sans-serif';
    ctx.fillText('❄️ 下雪了！', VW/2, 34);
  }
  if (thornHint > 0 && state === 'playing'){
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, thornHint*1.4) + ')';
    ctx.font = 'bold 15px "Microsoft YaHei", sans-serif';
    ctx.fillText('🌿 荆棘缠身！连续点击下蹲挣脱！', VW/2, 34);
  }
  // 奶鱼护体提示
  if (shieldHint > 0 && state === 'playing'){
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(255,236,150,' + Math.min(1, shieldHint*1.4) + ')';
    ctx.font = 'bold 18px "Microsoft YaHei", sans-serif';
    ctx.fillText('🐟 奶鱼护体！障碍已粉碎！', VW/2, 58);
  }
  if (state === 'playing'){ drawUI(); drawProgress(); }
  // 极限模式标识：最左上角小红字
  if (mode === 'extreme' && state === 'playing'){
    ctx.save();
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#FF5252';
    ctx.font = 'bold 12px "Microsoft YaHei", sans-serif';
    ctx.fillText('极限模式', 8, 2);
    ctx.restore();
  }
  if (state === 'ready') drawReady();
  if (state === 'gameover'){ drawUI(); drawGameOver(); }
  if (state === 'win'){ drawWin(); }
  // 暂停时画面静止（update 冻结），遮罩由 #pausePanel 面板承担

  // 右下角署名
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(43,43,43,.32)';
  ctx.font = '13px "Microsoft YaHei", sans-serif';
  ctx.fillText('「随枫」出品', VW - 10, VH - 4);
}

let last = performance.now(), acc = 0;
function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - last)/1000; last = now;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  while (acc >= 1/60){ _cu(1/60); acc -= 1/60; }
  draw();
}
requestAnimationFrame(loop);

// ---------- PWA：Service Worker 注册（HTTPS 下离线可玩；file:// 静默失败） ----------
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
